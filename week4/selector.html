<!DOCTYPE html>
<head>
    <title>Document</title>
    <style>
        p{
            color:red;
        }
        .test{
            color:blue;        
        }
        #id{
            color:aqua;
        }
        h1,span{
            color:brown;
        }
        div span{
            color:pink;
        }
        div>span{
            color:yellow;
        }
        span+p{
            color:blueviolet;
        }
        span~em{
            color:gold;
        }
        .mouse:hover{
            color:green;
        }
        input:focus{
            outline: none;
            border:1px solid red;
        }
        .after::after{
            display: inline-block;
            color:blueviolet;
            content: "after요소";
        }
    </style>
</head>
<body>
    <h1>기본선택자</h1>
    <p>타입 선택자를 선택합니다</p>
    <p class="test">클래스 선택자를
    살펴봅니다</p>
    <p id="id">아이디 선택자를 살펴봅니다</p>
    <span>그룹 선택자</span>

    <h1>결합자</h1>
    <div>
        <p>
            <span>자손 결합자</span>
        </p>
        <em>일반형제 결합자</em>
        <span>자식결합자</span>
        <p>인접형제 결합자</p>
        <em>일반형제 결합자</em>
    </div>
    <hr/>
    <h1>의사 클래스와 의사 요소</h1>
    <p class="mouse">마우스를 올려보세요</p>
    <input type="text"/>
    <p class="after">after로 요소를 만듭니다</p>
</body>
</html>
