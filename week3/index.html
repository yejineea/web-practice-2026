<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>문의하기</title>

    <meta name="description" content="문의사항을 남겨주세요.">
    <meta property="og:title" content="문의하기">
    <meta property="og:description" content="문의사항을 남겨주세요.">

<body>

    <header>
        <h1>문의하기</h1>
        <img src="https://cdn.imweb.me/upload/S20240329ee62cedd3a4b3/f9b6b435510f3.png" alt="문의하기 이미지">
    </header>

    <main>
        <h2>문의사항을 남겨주세요.</h2>

        <form>
            <fieldset>
                <legend>문의 폼</legend>

                <label for="name">이름</label>
                <input type="text" id="name" name="name">

                <label for="email">이메일</label>
                <input type="email" id="email" name="email">

                <label for="type">문의유형</label>
                <select id="type" name="type">
                    <option value="delivery">배송</option>
                    <option value="order">주문</option>
                    <option value="etc">기타</option>
                </select>

                <label for="content">문의내용</label>
                <textarea id="content" name="content"></textarea>

                <button type="submit">보내기</button>

            </fieldset>
        </form>
    </main>

    <!-- 푸터 -->
    <footer>
        <p>© 2026 문의하기</p>

            이메일:

                kimyejin0423@naver.com

        </p>
    </footer>

</html>
